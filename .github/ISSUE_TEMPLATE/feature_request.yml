name: Feature request
description: Suggest something admiral should do
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work in the UI, the CLI or the API.
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: How other tools do it
      description: Rancher, Lens, Portainer, Headlamp, OpenShift or anything else, and what you like or dislike about their approach.
  - type: dropdown
    id: rancher
    attributes:
      label: Is this about moving from Rancher?
      options:
        - "No"
        - "Yes, something Rancher does that admiral should match"
        - "Yes, something that blocks a migration"
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
