name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo workspace yet, nothing to test."
      - if: hashFiles('Cargo.toml') != ''
        run: rustup toolchain install --profile minimal
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em-dashes in docs
        shell: bash
        run: |
          if grep -rn --include='*.md' $'—' .; then
            echo "Use a comma, a colon or two sentences instead of an em-dash."
            exit 1
          fi
      - if: hashFiles('Cargo.toml') != ''
        run: rustup toolchain install --profile minimal --component clippy,rustfmt
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
